<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="ltTitle ltDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ltTitle">Why the same oysters kill one person and not another</title>
  <desc id="ltDesc">Two diagrams of the route from gut to body. Normally, blood leaving the intestine passes through the liver first, where resident immune cells strip out bacteria before the blood reaches the rest of the body. In cirrhosis the liver is scarred, so blood is diverted around it through collateral veins, the filtering cells that remain work poorly, and free iron in the blood feeds the organisms that get through.</desc>

  <defs>
    <marker id="flowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f7a73"/>
    </marker>
    <marker id="flowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8451a"/>
    </marker>
    <style>
      .gut     { fill: #f0ddd0; stroke: #0c1a22; stroke-width: 2.2; }
      .liver   { fill: #b9776a; stroke: #0c1a22; stroke-width: 2.2; }
      .cirr    { fill: #9e8878; stroke: #0c1a22; stroke-width: 2.2; }
      .vein    { fill: none; stroke: #6f8ba0; stroke-width: 12; stroke-linecap: round; }
      .shunt   { fill: none; stroke: #a8451a; stroke-width: 9; stroke-linecap: round; stroke-dasharray: 1 0; }
      .body    { fill: #eef1f3; stroke: #0c1a22; stroke-width: 2.2; }
      .bug     { fill: #2f6b4f; }
      .bugout  { fill: #a8451a; }
      .iron    { fill: #c8892f; }
      .kupffer { fill: #6b3f37; }
      .step    { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; fill: #0c1a22; }
      .tag     { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .06em; fill: #6c7c85; }
      .tagg    { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .06em; fill: #0f7a73; }
      .tagr    { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .06em; fill: #a8451a; }
      .sub     { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: #41525c; }
    </style>
  </defs>

  <rect width="880" height="400" fill="#fffefb"/>

  <!-- healthy -->
  <g transform="translate(40,0)">
    <text class="step" x="0" y="34">A healthy liver</text>

    <rect class="gut" x="0" y="150" width="76" height="62" rx="8"/>
    <text class="tag" x="10" y="232">gut</text>
    <g class="bug">
      <circle cx="20" cy="170" r="4"/><circle cx="40" cy="182" r="4"/>
      <circle cx="58" cy="166" r="4"/><circle cx="32" cy="196" r="4"/>
    </g>

    <path class="vein" d="M 82 181 L 122 181"/>
    <text class="tag" x="80" y="160">portal vein</text>

    <path class="liver" d="M 128 132 q 62 -14 98 10 q 16 40 -4 74 q -54 20 -94 2 Z"/>
    <g class="kupffer">
      <circle cx="158" cy="160" r="6"/><circle cx="196" cy="152" r="6"/>
      <circle cx="176" cy="188" r="6"/><circle cx="210" cy="186" r="6"/>
      <circle cx="146" cy="192" r="6"/>
    </g>
    <text class="tag" x="128" y="234">filtering cells</text>

    <path class="vein" d="M 230 181 L 268 181" marker-end="url(#flowg)"/>
    <rect class="body" x="274" y="142" width="62" height="78" rx="8"/>
    <text class="tagg" x="276" y="234">clean blood</text>

    <text class="sub" x="0" y="294">Everything absorbed from the gut goes</text>
    <text class="sub" x="0" y="313">through the liver first. Bacteria are</text>
    <text class="sub" x="0" y="332">stripped out before they reach anywhere</text>
    <text class="sub" x="0" y="351">that matters.</text>
  </g>

  <!-- cirrhosis -->
  <g transform="translate(490,0)">
    <text class="step" x="0" y="34">A cirrhotic liver</text>

    <rect class="gut" x="0" y="150" width="76" height="62" rx="8"/>
    <text class="tag" x="10" y="232">gut</text>
    <g class="bug">
      <circle cx="20" cy="170" r="4"/><circle cx="40" cy="182" r="4"/>
      <circle cx="58" cy="166" r="4"/><circle cx="32" cy="196" r="4"/>
    </g>

    <path class="vein" d="M 82 181 L 114 181"/>
    <path class="cirr" d="M 128 134 q 58 -10 92 12 q 12 38 -6 70 q -52 18 -88 0 Z"/>
    <g stroke="#6b5a4c" stroke-width="2" fill="none">
      <path d="M 140 150 q 24 12 48 2"/><path d="M 136 174 q 30 14 62 0"/>
      <path d="M 144 196 q 26 10 52 -2"/>
    </g>
    <circle class="kupffer" cx="166" cy="164" r="5" opacity="0.4"/>
    <circle class="kupffer" cx="196" cy="188" r="5" opacity="0.4"/>
    <text class="tagr" x="126" y="238">scarred, few left working</text>

    <path class="shunt" d="M 100 176 q 60 -70 132 -6" marker-end="url(#flowr)"/>
    <text class="tagr" x="108" y="96">blood diverted around it</text>

    <path class="vein" d="M 226 181 L 262 181" marker-end="url(#flowr)"/>
    <rect class="body" x="268" y="142" width="62" height="78" rx="8"/>
    <g class="bugout">
      <circle cx="286" cy="164" r="4"/><circle cx="308" cy="178" r="4"/>
      <circle cx="292" cy="198" r="4"/>
    </g>
    <g class="iron">
      <circle cx="312" cy="156" r="3.4"/><circle cx="278" cy="190" r="3.4"/>
    </g>
    <text class="tagr" x="264" y="234">bacteria, and free iron</text>

    <text class="sub" x="0" y="294">Scarring forces blood around the liver,</text>
    <text class="sub" x="0" y="313">what remains filters poorly, and loose</text>
    <text class="sub" x="0" y="332">iron in the blood is exactly what these</text>
    <text class="sub" x="0" y="351">organisms grow on.</text>
  </g>
</svg>
